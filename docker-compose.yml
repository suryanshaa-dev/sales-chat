
services:
  db:
    image: postgres:16-alpine
    container_name: sales-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_chat
      POSTGRES_USER: sales_chat_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - sales_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_chat_user -d sales_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sales_chat_data:
